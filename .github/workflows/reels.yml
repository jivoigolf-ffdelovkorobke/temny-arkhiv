name: reels
on:
  schedule:
    - cron: "0 6,12,17 * * *"   # 09:00, 15:00, 20:00 МСК
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          ARGS=""; [ -n "$IG_ACCESS_TOKEN" ] && ARGS="--post"
          python make_reel.py $ARGS 2>&1 | tee run.log || FAIL=1
          sed -i "s#${IG_ACCESS_TOKEN:-@@none@@}#***#g" run.log
          if [ -n "$FAIL" ]; then
            mkdir -p logs && tail -c 4000 run.log > logs/last_error.log
            git config user.name bot && git config user.email bot@users.noreply.github.com
            git add logs && git commit -qm "error log" && git push -q || true
            exit 1
          fi
          echo "::notice::$(grep -E '^(!|готово|опубликовано)' run.log | tr '\n' '|')"
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*/reel.mp4
      - name: save topic history
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add history.json && git commit -m "history" && git push || true
