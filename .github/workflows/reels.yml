name: reels
on:
  schedule:
    - cron: "0 6,12,17 * * *"   # 09:00, 15:00, 20:00 МСК
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "$IG_ACCESS_TOKEN" ]; then python make_reel.py --post; else python make_reel.py; fi
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*/reel.mp4
      - name: save topic history
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add history.json && git commit -m "history" && git push || true
